name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Verify static deploy output
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/product/index.html
          test -f out/oplossingen/index.html
          test -f out/integraties/index.html
          test -f out/pricing/index.html
          test -f out/resources/index.html
          test -f out/over-syntrx/index.html
          test -f out/contact/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
